# git-cliff config: next version and CHANGELOG.md from Conventional Commits, in the same
# Keep a Changelog layout release-plz writes for plasma-drop. Used by .github/workflows/release.yml.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

"""
body = """
{% if version -%}
{% set v = version | trim_start_matches(pat="v") -%}
{% if previous.version -%}
## [{{ v }}](https://github.com/SkeLLLa/quartz-drop/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [{{ v }}](https://github.com/SkeLLLa/quartz-drop/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = ".*", group = "<!-- 4 -->Other" },
]

[bump]
# First release when no tag exists yet.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
