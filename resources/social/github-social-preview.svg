<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">quartz-drop GitHub social preview</title>
  <desc id="desc">A social preview banner for quartz-drop, featuring the rose quartz raindrop terminal icon and project description.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1828"/>
      <stop offset=".54" stop-color="#15111d"/>
      <stop offset="1" stop-color="#0b0911"/>
    </linearGradient>
    <linearGradient id="panel" x1="88" y1="82" x2="1192" y2="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2f4a"/>
      <stop offset="1" stop-color="#18121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="124" x2="1070" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc2e8"/>
      <stop offset=".5" stop-color="#ff8fcf"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="356" cy="316" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7fc8" stop-opacity=".36"/>
      <stop offset=".45" stop-color="#ff7fc8" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ff7fc8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="18" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="24" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity=".38" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="350" cy="320" r="360" fill="url(#glow)"/>
  <path d="M0 514c140-42 262-46 382-15 128 33 236 70 384 34 118-29 235-81 514-28v135H0z" fill="#b0478f" opacity=".13"/>
  <path d="M0 552c210-30 354-8 496 22 162 34 312 46 500-14 105-34 196-45 284-27v107H0z" fill="#b48cff" opacity=".09"/>

  <rect x="88" y="82" width="1104" height="476" rx="22" fill="url(#panel)" filter="url(#soft-shadow)"/>
  <rect x="88" y="82" width="1104" height="68" rx="22" fill="#45385a"/>
  <path d="M88 128h1104v22H88z" fill="#45385a"/>
  <path d="M88 150h1104" stroke="#ff8fcf" stroke-width="4" stroke-opacity=".7"/>
  <circle cx="128" cy="116" r="9" fill="#ff5f57"/>
  <circle cx="158" cy="116" r="9" fill="#febc2e"/>
  <circle cx="188" cy="116" r="9" fill="#28c840"/>
  <path d="M222 116h250" stroke="#e2d0ee" stroke-width="10" stroke-linecap="round" stroke-opacity=".3"/>

  <image href="../icons/quartz-drop.svg" x="113" y="160" width="360" height="360"/>
  <path d="M143 500h298" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" opacity=".75"/>

  <text x="520" y="283" font-family="SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-size="82" font-weight="800" fill="#fbf2ff">quartz-drop</text>
  <text x="524" y="352" font-family="SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="650" fill="#ffb3e1">macOS dropdown app launcher</text>
  <text x="524" y="411" font-family="SF Mono, Menlo, JetBrains Mono, monospace" font-size="29" font-weight="700" fill="#ffd6f0">&gt; yakuake-style drop-down behavior</text>
  <text x="524" y="455" font-family="SF Mono, Menlo, JetBrains Mono, monospace" font-size="29" font-weight="700" fill="#ead6ff">&gt; for any app you configure</text>
  <path d="M524 492h250M806 492h82M919 492h172" stroke="#d9a8ff" stroke-width="8" stroke-linecap="round" stroke-opacity=".2"/>

  <path d="M88 82h1104v476H88z" fill="none" stroke="#ff8fcf" stroke-width="2" stroke-opacity=".3"/>
</svg>
