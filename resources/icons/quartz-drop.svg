<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">quartz-drop icon</title>
  <desc id="desc">The plasma-drop raindrop terminal mark, recut as a faceted rose quartz crystal on a macOS app icon tile.</desc>
  <defs>
    <linearGradient id="tile" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2238"/>
      <stop offset=".55" stop-color="#17121f"/>
      <stop offset="1" stop-color="#0c0a12"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="512" cy="430" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8fcf" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#b48cff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop-fill" x1="56" y1="20" x2="200" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a6488"/>
      <stop offset=".52" stop-color="#2c2038"/>
      <stop offset="1" stop-color="#140e1c"/>
    </linearGradient>
    <linearGradient id="terminal-gloss" x1="70" y1="36" x2="194" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="highlight" cx="84" cy="60" r="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="56" y1="16" x2="200" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc2e8"/>
      <stop offset=".5" stop-color="#ff8fcf"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="148%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="9" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="9" result="blur"/>
      <feFlood flood-color="#3a0f2e" flood-opacity=".5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="drop-clip">
      <path d="M128 16C102 52 73 83 56 121c-23 51 5 112 59 126 8 2 18 2 26 0 54-14 82-75 59-126-17-38-46-69-72-105z"/>
    </clipPath>
  </defs>

  <!-- macOS app icon tile: 824 px rounded square on the 1024 px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>

  <g transform="translate(512 518) scale(2.55) translate(-128 -132)">
    <path d="M128 16C102 52 73 83 56 121c-23 51 5 112 59 126 8 2 18 2 26 0 54-14 82-75 59-126-17-38-46-69-72-105z" fill="#ff5fb8" opacity=".22" transform="translate(0 5)"/>
    <path d="M128 16C102 52 73 83 56 121c-23 51 5 112 59 126 8 2 18 2 26 0 54-14 82-75 59-126-17-38-46-69-72-105z" fill="url(#drop-fill)" filter="url(#shadow)"/>
    <path d="M128 16C102 52 73 83 56 121c-23 51 5 112 59 126 8 2 18 2 26 0 54-14 82-75 59-126-17-38-46-69-72-105z" fill="url(#highlight)"/>

    <g clip-path="url(#drop-clip)">
      <!-- Crystal facets: the change from plasma-drop's smooth drop. -->
      <path d="M128 16L96 81M128 16l32 65M128 16v65" stroke="#ffd6f0" stroke-opacity=".3" stroke-width="2.5"/>
      <path d="M128 16L45 81h166z" fill="#ffffff" opacity=".06"/>
      <path d="M128 16l83 65h-83z" fill="#ffffff" opacity=".05"/>

      <path d="M45 81h166v43H45z" fill="#4a3b5c"/>
      <path d="M45 123h166" stroke="#ff8fcf" stroke-width="4" stroke-linecap="round" stroke-opacity=".85"/>
      <path d="M80 103h96" stroke="#e8d2f2" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>

      <path d="M75 148l30 26-30 26" fill="none" stroke="#ffb3e1" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M124 204h48" stroke="#fbefff" stroke-width="13" stroke-linecap="round"/>

      <path d="M121 146h54M134 164h38M72 221h74M158 221h26" stroke="#d9a8ff" stroke-opacity=".24" stroke-width="6" stroke-linecap="round"/>
      <path d="M88 136h71M88 225h38" stroke="#ffc9ea" stroke-opacity=".58" stroke-width="5" stroke-linecap="round"/>
      <path d="M93 189h34M138 189h42M93 207h22M128 207h57" stroke="#ead6ff" stroke-opacity=".52" stroke-width="5" stroke-linecap="round"/>
      <path d="M70 71h172v44H70z" fill="#ffffff" opacity=".08" transform="rotate(-24 128 93)"/>
      <path d="M55 216h150v34H55z" fill="#b48cff" opacity=".16"/>
      <path d="M55 123h146v123H55z" fill="url(#terminal-gloss)"/>
    </g>

    <path d="M128 16C102 52 73 83 56 121c-23 51 5 112 59 126 8 2 18 2 26 0 54-14 82-75 59-126-17-38-46-69-72-105z" fill="none" stroke="url(#rim)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M92 61c-16 21-31 39-40 61-12 29-8 61 9 88" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="8" opacity=".26"/>
  </g>
</svg>
